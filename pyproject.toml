[project]
name = "pfpx-tools"
version = "0.1.0"
description = "Compiles Weather, NAT and PACOTS tracks into format used by PFPX"
readme = "README.md"
requires-python = ">= 3.8"
dependencies = []

[project.scripts]
pfpx-tools = "pfpx_tools:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
preview = true
select = ["E4", "E7", "E9", "F", "B", "Q", "N", "I", "C4", "ICN", "PIE", "RET", "SIM", "PTH", "DTZ"]